<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dossiê</title>
<style>
/* Fontes hospedadas no próprio site, para que a impressão e os PDFs gerados pelo robô saiam iguais. */
@font-face{font-family:'Source Serif 4';font-style:normal;font-weight:500;font-display:swap;src:url(lib/fontes/source-serif-4-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Source Serif 4';font-style:normal;font-weight:600;font-display:swap;src:url(lib/fontes/source-serif-4-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Source Serif 4';font-style:normal;font-weight:700;font-display:swap;src:url(lib/fontes/source-serif-4-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url(lib/fontes/ibm-plex-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:swap;src:url(lib/fontes/ibm-plex-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url(lib/fontes/ibm-plex-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-style:italic;font-weight:400;font-display:swap;src:url(lib/fontes/ibm-plex-sans-latin-400-italic.woff2) format('woff2')}

/* Documento para impressão em A4. Visual sóbrio, de relatório técnico: títulos em serifa, texto em sans, um único tom de destaque.
   Fica sempre no tema claro, porque é feito para ser impresso. */
:root{
  --ink:#1c2026; --ink-2:#4b525c; --ink-3:#757c87; --line:#d9dce1; --soft:#f3f4f6; --paper:#ffffff; --desk:#e7e9ec;
  --accent:#7d1d1d; --accent-soft:#f6eaea; --g-extrema:#7d1d1d; --g-direita:#b8524a; --g-alinhados:#b88a3e; --g-esquerda:#3d6b85; --g-outros:#9aa0a8;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font:10.5pt/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f2c94c;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.barra{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff}
.barra .in{max-width:210mm;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px}
.barra b{font-family:var(--serif);font-size:15pt;font-weight:600;margin-right:auto}
.barra button,.barra a{border:1px solid #59616c;background:transparent;color:#fff;border-radius:5px;padding:7px 12px;font-weight:600;font-size:10pt;cursor:pointer;text-decoration:none}
.barra .forte{background:#fff;color:var(--ink);border-color:#fff}

.folha{background:var(--paper);max-width:210mm;margin:18px auto 40px;padding:16mm 15mm 18mm;box-shadow:0 2px 14px rgba(0,0,0,.12)}
@media (max-width:820px){.folha{margin:0;padding:22px 16px;box-shadow:none}}

.cab{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.tipo{font-size:8.5pt;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--serif);font-weight:700;font-size:26pt;line-height:1.05;margin:4px 0 4px;text-wrap:balance}
.sub{color:var(--ink-2);font-size:11pt;margin:0}
.meta{color:var(--ink-3);font-size:8.5pt;margin-top:6px}
h2{font-family:var(--serif);font-weight:600;font-size:14.5pt;margin:20px 0 6px;padding-top:6px;border-top:1px solid var(--line);break-after:avoid}
h3{font-size:9pt;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 6px;break-after:avoid}
p{margin:0 0 8px}
.leve{color:var(--ink-2)}
.peq{font-size:8.5pt;color:var(--ink-3)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0 4px}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-radius:4px;padding:7px 9px;break-inside:avoid}
.kpi b{display:block;font-family:var(--serif);font-size:16pt;font-weight:600;line-height:1.15}
.kpi span{font-size:8pt;color:var(--ink-3);line-height:1.3;display:block}

.duas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:620px){.duas{grid-template-columns:1fr}}
.duas > div{min-width:0}

table{width:100%;border-collapse:collapse;font-size:8.8pt;margin:4px 0 6px}
th{text-align:left;font-weight:600;font-size:7.8pt;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--ink);padding:4px 5px}
td{border-bottom:1px solid var(--line);padding:4px 5px;vertical-align:top}
tr{break-inside:avoid}
td.d,th.d{text-align:right;white-space:nowrap}
.tabela{overflow-x:auto}
.ementa{color:var(--ink-2)}

.barras{display:grid;grid-template-columns:minmax(0,17em) minmax(0,1fr) auto;gap:3px 8px;align-items:center;font-size:8.8pt;break-inside:avoid}
.barras .b{height:9px;background:var(--cor,var(--accent));border-radius:2px;min-width:1px}
.pilha{display:flex;height:14px;border-radius:2px;overflow:hidden;margin:4px 0}
.pilha span{background:var(--cor)}
.leg{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:8pt;color:var(--ink-2)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--cor);margin-right:4px;vertical-align:-1px}

.etq{display:inline-block;font-size:7.5pt;font-weight:600;border-radius:3px;padding:0 5px;line-height:1.6;white-space:nowrap}
.etq.ext{background:var(--accent);color:#fff}
.etq.dir{border:1px solid var(--g-direita);color:var(--g-direita)}
.etq.contra{border:1px solid var(--g-esquerda);color:var(--g-esquerda)}
.etq.eq{background:var(--soft);color:var(--ink-2)}
.voto-com{color:var(--accent);font-weight:600}
.voto-contra{color:var(--g-esquerda);font-weight:600}

.mapa svg{display:block;width:100%;height:auto;max-height:110mm}
.escala{display:flex;gap:0;height:8px;margin:4px 0 2px;max-width:70mm}
.escala span{flex:1;background:var(--c)}

.metodo{font-size:8.5pt;color:var(--ink-2)}
.metodo dt{font-weight:600;color:var(--ink);margin-top:5px}
.metodo dd{margin:0}
.rodape{margin-top:18px;padding-top:8px;border-top:1px solid var(--line);font-size:8pt;color:var(--ink-3)}

/* Seletor inicial */
.escolha{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:10px}
@media (max-width:620px){.escolha{grid-template-columns:1fr}}
.cartao{border:1px solid var(--line);border-radius:6px;padding:14px}
.cartao h2{border:0;margin-top:0;padding-top:0}
.cartao input,.cartao select{width:100%;border:1px solid var(--line);border-radius:5px;padding:8px 10px;margin:6px 0 10px;background:#fff}
.cartao button{border:0;background:var(--ink);color:#fff;border-radius:5px;padding:8px 14px;font-weight:600;cursor:pointer}
.carregando{color:var(--ink-2);padding:30px 0}

@page{size:A4;margin:14mm 13mm 16mm;
  @bottom-left{content:"Dossiê. Fontes: Câmara dos Deputados, Senado Federal, Portal da Transparência e IBGE.";font:7.5pt "IBM Plex Sans",sans-serif;color:#757c87}
  @bottom-right{content:counter(page) " / " counter(pages);font:7.5pt "IBM Plex Sans",sans-serif;color:#757c87}}
@media print{
  body{background:#fff;font-size:10pt}
  .barra{display:none}
  .folha{max-width:none;margin:0;padding:0;box-shadow:none}
  a{color:var(--ink);text-decoration:none}
  h2{break-after:avoid}
  .quebra{break-before:page}
}
</style>
</head>
<body>
<div class="barra"><div class="in"><b>Dossiê</b>
  <a href="dossie.html">Novo dossiê</a>
  <button type="button" class="forte" id="imprimir">Imprimir ou salvar em PDF</button>
</div></div>
<main class="folha" id="folha"><p class="carregando">Carregando os dados…</p></main>

<script src="pautas.js?v=20261029b"></script>
<script src="lib/d3.min.js?v=7.9.0"></script>
<script src="lib/topojson.min.js?v=3.0.2"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const P = window.PAUTAS; const PAUTA = Object.fromEntries(P.lista.map(p => [p.id, p.nome]));
const NOME_PARTIDO = { PODE: 'Podemos', UNIAO: 'União Brasil', REPUBLICANOS: 'Republicanos', SOLIDARIEDADE: 'Solidariedade', CIDADANIA: 'Cidadania', AVANTE: 'Avante', NOVO: 'Novo', REDE: 'Rede', PCDOB: 'PCdoB', SP: 'Sem partido' };
const partido = p => (p.p === 'OUTROS' || p.p === 'SP') ? (p.s || 'Sem partido') : (NOME_PARTIDO[p.p] || p.s || p.p || '');
const CASA = { C: 'Câmara dos Deputados', S: 'Senado Federal' };
const CARGO = { C: 'Deputado(a) federal', S: 'Senador(a)' };
const CLASSE = { nucleo: 'Núcleo da direita', alinhado: 'Alinhado(a) à direita', proximo: 'Próximo(a) da direita' };
const GRUPOS = { extrema: 'Extrema-direita', direita: 'Direita', alinhados: 'Alinhados', esquerda: 'Esquerda', outros: 'Outros partidos' };
const ORDEM_G = ['extrema', 'direita', 'alinhados', 'esquerda', 'outros'];
const VOTO = { S: 'Sim', N: 'Não', A: 'Abstenção', O: 'Obstrução', '-': 'Outro' };
const UFNOME = { AC: 'Acre', AL: 'Alagoas', AP: 'Amapá', AM: 'Amazonas', BA: 'Bahia', CE: 'Ceará', DF: 'Distrito Federal', ES: 'Espírito Santo', GO: 'Goiás', MA: 'Maranhão', MT: 'Mato Grosso', MS: 'Mato Grosso do Sul', MG: 'Minas Gerais', PA: 'Pará', PB: 'Paraíba', PR: 'Paraná', PE: 'Pernambuco', PI: 'Piauí', RJ: 'Rio de Janeiro', RN: 'Rio Grande do Norte', RS: 'Rio Grande do Sul', RO: 'Rondônia', RR: 'Roraima', SC: 'Santa Catarina', SP: 'São Paulo', SE: 'Sergipe', TO: 'Tocantins' };
const UFCOD = { 11: 'RO', 12: 'AC', 13: 'AM', 14: 'RR', 15: 'PA', 16: 'AP', 17: 'TO', 21: 'MA', 22: 'PI', 23: 'CE', 24: 'RN', 25: 'PB', 26: 'PE', 27: 'AL', 28: 'SE', 29: 'BA', 31: 'MG', 32: 'ES', 33: 'RJ', 35: 'SP', 41: 'PR', 42: 'SC', 43: 'RS', 50: 'MS', 51: 'MT', 52: 'GO', 53: 'DF' };
const fmt = n => Number(n || 0).toLocaleString('pt-BR');
const pct = (v, d = 0) => (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
const dataBR = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) : '';
function reais(v) {
  const a = Math.abs(v || 0), f = (x, d) => x.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
  if (a >= 1e9) return 'R$ ' + f(v / 1e9, 1) + ' bi'; if (a >= 1e6) return 'R$ ' + f(v / 1e6, a >= 1e8 ? 0 : 1) + ' mi';
  if (a >= 1e3) return 'R$ ' + f(v / 1e3, 0) + ' mil'; return 'R$ ' + f(v || 0, 0);
}
const corta = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : s; };
const json = u => fetch(u, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(u); return r.json(); });
const hoje = new Date().toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });
function etqGrau(x) {
  if (!x || !x.s) return '';
  if (x.s === 'barra') return '<span class="etq contra">Contra a pauta da direita</span>';
  return x.g === 'extrema' ? '<span class="etq ext">Extrema-direita</span>' : '<span class="etq dir">Direita</span>';
}
const origem = x => x && x.eq ? '<span class="etq eq">Conferido pela equipe</span>' : '<span class="peq">Triagem por IA</span>';
const pautas = x => (x && x.p || []).map(p => PAUTA[p] || p).join(', ');
const barras = (linhas, fmtv, cor) => { const m = Math.max(...linhas.map(l => l[1]), 1); return `<div class="barras">${linhas.map(([n, v]) => `<span>${esc(n)}</span><span class="b" style="${cor ? '--cor:' + cor : ''};width:${100 * v / m}%"></span><span class="num">${fmtv(v)}</span>`).join('')}</div>`; };

const METODO = `<h2>Notas de método</h2><dl class="metodo">
  <dt>Fontes</dt><dd>Dados abertos da Câmara dos Deputados e do Senado Federal (proposições e votações nominais de plenário e comissões, desde fevereiro de 2023), Portal da Transparência (emendas parlamentares individuais de 2023 a 2026) e IBGE (Censo 2022).</dd>
  <dt>Núcleo da direita</dt><dd>Parlamentares de PL, Novo, PP, União Brasil, Republicanos e Podemos.</dd>
  <dt>Votações disputadas e índice de alinhamento</dt><dd>A posição da direita numa votação é a da maioria do núcleo, quando ao menos 60% dele vota no mesmo sentido. A referência do campo do governo é a bancada do PT, pela mesma regra. Disputadas são as votações em que as duas posições se opõem. O índice é a porcentagem dessas votações em que o parlamentar votou como a direita, calculado a partir de 10 votações disputadas. Alinhados têm índice de 80% ou mais e próximos, de 60% a 80%.</dd>
  <dt>Pautas e grau</dt><dd>Cada proposição é classificada, a partir da ementa, nas 16 pautas acompanhadas, com o sentido (faz avançar ou vai contra a pauta da direita) e o grau (direita ou extrema-direita). A classificação inicial é feita por inteligência artificial e serve como triagem. Os itens marcados como conferidos foram revisados pela equipe. O grau se refere à proposição, não à pessoa.</dd>
  <dt>Emendas</dt><dd>Valores empenhados em emendas individuais, salvo indicação de valor pago ou recebido. Transferências especiais (Pix) são repassadas a estados e municípios sem finalidade definida. Nas emendas, os grupos são definidos pelo partido: extrema-direita (PL, Novo, Missão), direita (PP, União Brasil, Republicanos, Podemos, PSD, Cidadania, Solidariedade), alinhados (MDB, PDT, Rede, PSB, PV), esquerda (PT, PSOL, PCdoB) e outros.</dd>
</dl>`;

// --------------------------------------------------------------- dossiê do parlamentar
async function dossieParlamentar(k) {
  const [ind, prop, vr, em] = await Promise.all([json('dados/indice.json'), json('dados/proposicoes-direita.json'), json('dados/votacoes-resumo.json'), json('dados/emendas.json').catch(() => null)]);
  const p = ind.p[k]; if (!p) throw new Error('parlamentar não encontrado');
  document.title = 'Dossiê ' + p.n;
  const casa = k[0], num = +k.slice(1);
  // Votos nas votações disputadas
  const disp = vr.itens.filter(v => v.disp && v.k === casa);
  const anos = [...new Set(disp.map(v => v.d.slice(0, 4)))];
  const arqs = await Promise.all(anos.map(a => json(`dados/votacoes-${a}.json`).catch(() => ({ itens: [] }))));
  const votos = new Map();
  arqs.forEach(a => a.itens.forEach(v => { for (const [c, l] of Object.entries(v.v || {})) if (l.includes(num)) { votos.set(v.id, c); break; } }));
  let com = 0, contra = 0, fora = 0;
  const linhasV = disp.map(v => { const c = votos.get(v.id); const tipo = !c || !['S', 'N'].includes(c) ? 'fora' : c === v.bl ? 'com' : 'contra'; if (tipo === 'com') com++; else if (tipo === 'contra') contra++; else fora++; return { v, c, tipo }; });
  const vistos = new Set();
  const destaque = linhasV.filter(l => l.c && l.v.x && l.v.x.s).sort((a, b) => b.v.d.localeCompare(a.v.d))
    .filter(l => { const ch = (l.v.mat || l.v.id) + l.v.d; if (vistos.has(ch)) return false; vistos.add(ch); return true; }).slice(0, 15);
  // Proposições
  const meus = prop.itens.filter(it => (it.a || []).includes(k));
  const ext = meus.filter(it => it.x.g === 'extrema').length;
  const lista = [...meus].sort((a, b) => (b.x.g === 'extrema') - (a.x.g === 'extrema') || b.d.localeCompare(a.d)).slice(0, 20);
  const pp = Object.entries(p.pp || {}).sort((a, b) => b[1] - a[1]);
  const e = em && em.parl ? em.parl[k] : null;
  const grupoE = e ? GRUPOS[e.g] : '';

  let h = `<header class="cab"><div class="tipo">Dossiê parlamentar</div><h1>${esc(p.n)}</h1>
    <p class="sub">${CARGO[casa]} · ${esc(partido(p))}/${esc(p.uf || '')} · ${CASA[casa]}</p>
    <div class="meta">Gerado em ${hoje}. Período coberto de fevereiro de 2023 a ${hoje.replace(/^\d+ de /, '')}.</div></header>
  <section><h2>Resumo</h2>
    <p class="leve">${p.cl ? `Classificação no observatório: <b>${CLASSE[p.cl]}</b>.` : 'Não integra o núcleo da direita nem atinge 60% de alinhamento nas votações disputadas.'}${grupoE ? ` Nas emendas, o partido está no grupo <b>${grupoE}</b>.` : ''}</p>
    <div class="kpis num">
      <div class="kpi"><b>${p.i == null ? '—' : String(p.i).replace('.', ',') + '%'}</b><span>índice de alinhamento com a direita</span></div>
      <div class="kpi"><b>${fmt(p.vd)}</b><span>votações disputadas em que votou</span></div>
      <div class="kpi"><b>${fmt(meus.length)}</b><span>proposições com pauta da direita, de ${fmt(p.np)} apresentadas</span></div>
      <div class="kpi"><b>${fmt(ext)}</b><span>de grau extrema-direita</span></div>
    </div>
    ${e ? `<div class="kpis num">
      <div class="kpi"><b>${reais(e.emp)}</b><span>em emendas individuais empenhadas</span></div>
      <div class="kpi"><b>${reais(e.pago)}</b><span>já pagos</span></div>
      <div class="kpi"><b>${e.emp ? pct(e.pix / e.emp) : '—'}</b><span>em transferências especiais (Pix)</span></div>
      <div class="kpi"><b>${fmt(e.nmun || 0)}</b><span>municípios beneficiados</span></div></div>` : ''}
  </section>`;

  h += `<section><h2>Proposições com pauta da direita</h2>
    ${meus.length ? `<p class="leve">Das ${fmt(meus.length)} proposições de autoria ou coautoria classificadas como pauta da direita, ${fmt(ext)} têm grau extrema-direita. A lista mostra até 20, começando pelas de extrema-direita.</p>
    <div class="duas"><div><h3>Pautas mais frequentes</h3>${barras(pp.slice(0, 8).map(([id, n]) => [PAUTA[id] || id, n]), fmt)}</div>
      <div><h3>Por ano de apresentação</h3>${barras(Object.entries(meus.reduce((a, it) => { const y = it.d.slice(0, 4); a[y] = (a[y] || 0) + 1; return a; }, {})).sort(), fmt)}</div></div>
    <div class="tabela"><table><thead><tr><th>Proposição</th><th>Ementa</th><th>Pauta</th><th>Grau</th></tr></thead><tbody>
    ${lista.map(it => `<tr><td class="num" style="white-space:nowrap"><b>${esc(it.c)}</b><br><span class="peq">${dataBR(it.d)}</span></td><td><span class="ementa">${esc(corta(it.e, 230))}</span>${it.x.m ? `<br><span class="peq">${esc(it.x.m)}</span>` : ''}</td><td>${esc(pautas(it.x))}</td><td>${etqGrau(it.x)}<br>${origem(it.x)}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="leve">Nenhuma proposição de autoria ou coautoria classificada como pauta da direita no período.</p>'}
  </section>`;

  h += `<section><h2>Votações disputadas</h2>
    ${disp.length ? `<p class="leve">Em ${fmt(disp.length)} votações nominais da ${casa === 'C' ? 'Câmara' : 'casa'} a direita e o PT votaram em sentidos opostos. ${esc(p.n)} votou como a direita em ${fmt(com)}, contra a direita em ${fmt(contra)} e não votou ou registrou outro voto em ${fmt(fora)}.</p>
    <div class="pilha" style="max-width:120mm"><span style="--cor:var(--accent);width:${100 * com / disp.length}%"></span><span style="--cor:var(--g-esquerda);width:${100 * contra / disp.length}%"></span><span style="--cor:var(--line);width:${100 * fora / disp.length}%"></span></div>
    <div class="leg"><span><i style="--cor:var(--accent)"></i>Com a direita ${pct(com / disp.length)}</span><span><i style="--cor:var(--g-esquerda)"></i>Contra ${pct(contra / disp.length)}</span><span><i style="--cor:var(--line)"></i>Ausente ou outro ${pct(fora / disp.length)}</span></div>
    ${destaque.length ? `<h3>Votações ligadas às pautas acompanhadas (uma por matéria e data)</h3><div class="tabela"><table><thead><tr><th>Data</th><th>Matéria</th><th>Pauta</th><th>Direita</th><th>Voto</th><th>Resultado</th></tr></thead><tbody>
    ${destaque.map(({ v, c, tipo }) => `<tr><td class="num">${dataBR(v.d)}</td><td><b>${esc(v.mat || 'Votação')}</b> <span class="peq">${v.pl ? 'Plenário' : esc(v.o)}</span><br><span class="ementa">${esc(corta(v.me || v.desc, 150))}</span></td><td>${esc(pautas(v.x))}<br>${etqGrau(v.x)}</td><td>${VOTO[v.bl] || ''}</td><td class="${tipo === 'com' ? 'voto-com' : tipo === 'contra' ? 'voto-contra' : ''}">${VOTO[c] || ''}</td><td>${v.res === 'A' ? 'Aprovada' : v.res === 'R' ? 'Rejeitada' : ''}</td></tr>`).join('')}
    </tbody></table></div>` : ''}` : '<p class="leve">Sem votações disputadas registradas para este parlamentar.</p>'}
  </section>`;

  if (e) {
    const fs = (e.pix ? [...e.funcoes, ['Transferências especiais (Pix)', e.pix]] : e.funcoes).sort((a, b) => b[1] - a[1]).slice(0, 9);
    h += `<section class="quebra"><h2>Emendas parlamentares</h2>
      <p class="leve">Emendas individuais de 2023 a 2026: ${reais(e.emp)} empenhados e ${reais(e.pago)} pagos. ${e.emp ? pct(e.pix / e.emp) : ''} foram transferências especiais (Pix), sem finalidade definida.</p>
      <div class="duas"><div><h3>Por área</h3>${barras(fs, reais)}</div>
        <div><h3>Por ano da emenda</h3>${barras(Object.entries(e.anos || {}).sort(), reais)}</div></div>
      <div class="duas"><div><h3>Municípios que mais receberam</h3><table><tbody>${(e.munis || []).map(([m, v]) => `<tr><td>${esc(m)}</td><td class="d num">${reais(v)}</td></tr>`).join('')}</tbody></table></div>
        <div><h3>Entidades e empresas que mais receberam</h3>${(e.favs || []).length ? `<table><tbody>${e.favs.map(([f, nj, v]) => `<tr><td>${esc(f)}<br><span class="peq">${esc(nj)}</span></td><td class="d num">${reais(v)}</td></tr>`).join('')}</tbody></table>` : '<p class="peq">Nenhum pagamento a entidade privada.</p>'}</div></div>
      ${(e.objs || []).length ? `<h3>Principais convênios</h3><table><thead><tr><th>Objeto</th><th>Local</th><th class="d">Valor</th></tr></thead><tbody>${e.objs.map(([o, v, l]) => `<tr><td>${esc(corta(o, 180))}</td><td>${esc(l)}</td><td class="d num">${reais(v)}</td></tr>`).join('')}</tbody></table>` : ''}
    </section>`;
  }
  h += METODO + `<div class="rodape">Dossiê gerado automaticamente a partir de dados públicos em ${hoje}. As classificações por IA são triagem e podem conter erros.</div>`;
  $('#folha').innerHTML = h;
}

// --------------------------------------------------------------- dossiê do estado
async function dossieEstado(uf) {
  const [ind, prop, em, mun, topo] = await Promise.all([json('dados/indice.json'), json('dados/proposicoes-direita.json'), json('dados/emendas.json').catch(() => null), json('dados/emendas-municipios.json').catch(() => null), fetch('dados/municipios.topo.json').then(r => r.json()).catch(() => null)]);
  const nome = UFNOME[uf]; if (!nome) throw new Error('estado não encontrado');
  document.title = 'Dossiê ' + nome;
  const banc = Object.entries(ind.p).filter(([k, p]) => p.uf === uf && (p.vd || p.np)).map(([k, p]) => Object.assign({ k }, p));
  const dep = banc.filter(p => p.c === 'C'), sen = banc.filter(p => p.c === 'S');
  const nuc = banc.filter(p => p.cl === 'nucleo').length, ali = banc.filter(p => p.cl === 'alinhado').length, prox = banc.filter(p => p.cl === 'proximo').length;
  const comI = banc.filter(p => p.i != null); const media = comI.length ? comI.reduce((a, p) => a + p.i, 0) / comI.length : null;
  const chaves = new Set(banc.map(p => p.k));
  const props = prop.itens.filter(it => (it.a || []).some(a => chaves.has(a)));
  const ext = props.filter(it => it.x.g === 'extrema').length;
  const pp = {}; props.forEach(it => (it.x.p || []).forEach(p => pp[p] = (pp[p] || 0) + 1));
  const E = em && em.estados ? em.estados[uf] : null;
  const ordem = [...banc].sort((a, b) => (b.i ?? -1) - (a.i ?? -1) || b.nd - a.nd);
  const lista = [...props].sort((a, b) => (b.x.g === 'extrema') - (a.x.g === 'extrema') || b.d.localeCompare(a.d)).slice(0, 15);
  const nomeDe = k => (ind.p[k] || {}).n || k;

  let h = `<header class="cab"><div class="tipo">Dossiê estadual</div><h1>${esc(nome)}</h1>
    <p class="sub">Bancada no Congresso Nacional, proposições e emendas parlamentares</p>
    <div class="meta">Gerado em ${hoje}. Período coberto de fevereiro de 2023 a ${hoje.replace(/^\d+ de /, '')}.</div></header>
  <section><h2>Resumo</h2>
    <div class="kpis num">
      <div class="kpi"><b>${fmt(dep.length)} e ${fmt(sen.length)}</b><span>deputados e senadores com atividade no período</span></div>
      <div class="kpi"><b>${fmt(nuc)}</b><span>no núcleo da direita</span></div>
      <div class="kpi"><b>${fmt(ali + prox)}</b><span>de outros partidos alinhados ou próximos à direita</span></div>
      <div class="kpi"><b>${media == null ? '—' : media.toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + '%'}</b><span>índice médio de alinhamento da bancada</span></div>
    </div>
    <div class="kpis num">
      <div class="kpi"><b>${fmt(props.length)}</b><span>proposições com pauta da direita da bancada</span></div>
      <div class="kpi"><b>${fmt(ext)}</b><span>de grau extrema-direita</span></div>
      ${E ? `<div class="kpi"><b>${reais(E.total)}</b><span>em emendas individuais destinadas ao estado</span></div>
      <div class="kpi"><b>R$ ${fmt(Math.round(E.total / E.pop))}</b><span>por habitante</span></div>` : ''}
    </div>
  </section>
  <section><h2>Bancada</h2>
    <p class="leve">Parlamentares do estado com votações ou proposições no período, ordenados pelo índice de alinhamento com a direita.</p>
    <div class="tabela"><table><thead><tr><th>Parlamentar</th><th>Partido</th><th>Casa</th><th>Classificação</th><th class="d">Índice</th><th class="d">Proposições da direita</th><th class="d">Emendas</th></tr></thead><tbody>
    ${ordem.map(p => { const e = em && em.parl ? em.parl[p.k] : null; return `<tr><td>${esc(p.n)}</td><td>${esc(partido(p))}</td><td>${p.c === 'S' ? 'Senado' : 'Câmara'}</td><td>${p.cl ? CLASSE[p.cl].replace('(a)', '') : '—'}</td><td class="d num">${p.i == null ? '—' : String(p.i).replace('.', ',') + '%'}</td><td class="d num">${fmt(p.nd)}${p.nx ? ` <span class="peq">(${fmt(p.nx)} extrema)</span>` : ''}</td><td class="d num">${e ? reais(e.emp) : '—'}</td></tr>`; }).join('')}
    </tbody></table></div>
  </section>`;

  h += `<section><h2>Proposições com pauta da direita</h2>
    ${props.length ? `<div class="duas"><div><h3>Pautas mais frequentes</h3>${barras(Object.entries(pp).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([id, n]) => [PAUTA[id] || id, n]), fmt)}</div>
      <div><h3>Quem mais apresentou</h3>${barras(ordem.filter(p => p.nd).sort((a, b) => b.nd - a.nd).slice(0, 8).map(p => [p.n, p.nd]), fmt)}</div></div>
    <h3>Destaques</h3><div class="tabela"><table><thead><tr><th>Proposição</th><th>Ementa</th><th>Autoria no estado</th><th>Grau</th></tr></thead><tbody>
    ${lista.map(it => `<tr><td class="num" style="white-space:nowrap"><b>${esc(it.c)}</b><br><span class="peq">${dataBR(it.d)}</span></td><td><span class="ementa">${esc(corta(it.e, 200))}</span><br><span class="peq">${esc(pautas(it.x))}</span></td><td>${esc(it.a.filter(a => chaves.has(a)).map(nomeDe).slice(0, 3).join(', '))}</td><td>${etqGrau(it.x)}<br>${origem(it.x)}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="leve">Nenhuma proposição classificada como pauta da direita.</p>'}
  </section>`;

  if (E) {
    const linhasG = ORDEM_G.filter(g => E.grupos[g] > 0);
    const T = Object.fromEntries((em.temas || []).map(t => [t.id, t.nome]));
    h += `<section class="quebra"><h2>Emendas parlamentares destinadas ao estado</h2>
      <p class="leve">De 2023 a 2026, o estado recebeu ${reais(E.total)} em emendas individuais empenhadas (R$ ${fmt(Math.round(E.total / E.pop))} por habitante), dos quais ${reais(E.pago)} já foram pagos. ${pct(E.pix / E.total)} foram transferências especiais (Pix).</p>
      <h3>De onde veio o dinheiro</h3>
      <div class="pilha">${linhasG.map(g => `<span style="--cor:var(--g-${g});width:${100 * E.grupos[g] / E.total}%"></span>`).join('')}</div>
      <div class="leg">${linhasG.map(g => `<span><i style="--cor:var(--g-${g})"></i>${GRUPOS[g]} ${pct(E.grupos[g] / E.total)}</span>`).join('')}</div>
      <div class="duas" style="margin-top:8px"><div><h3>Quem mais destinou</h3><table><tbody>${E.top.map(p => `<tr><td>${esc(p.n)} <span class="peq">${esc(partido(p))}</span></td><td class="d num">${reais(p.v)}</td></tr>`).join('')}</tbody></table></div>
        <div><h3>Principais áreas</h3>${barras(Object.entries(E.areas).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([t, v]) => [T[t] || t, v / E.total]), v => pct(v))}</div></div>
      <div id="mapaUf"></div>
    </section>`;
  }
  h += METODO + `<div class="rodape">Dossiê gerado automaticamente a partir de dados públicos em ${hoje}. As classificações por IA são triagem e podem conter erros.</div>`;
  $('#folha').innerHTML = h;
  if (E && mun && topo) desenharMunicipios(uf, mun, topo);
}

function desenharMunicipios(uf, mun, topo) {
  const obj = topo.objects[Object.keys(topo.objects)[0]];
  const feats = topojson.feature(topo, obj).features.filter(f => UFCOD[f.properties.id.slice(0, 2)] === uf);
  feats.forEach(f => { if (d3.geoArea(f) > 2 * Math.PI) { const g = f.geometry; if (g.type === 'Polygon') g.coordinates.forEach(r => r.reverse()); else g.coordinates.forEach(p => p.forEach(r => r.reverse())); } });
  const ix = Object.fromEntries(mun.campos.map((c, i) => [c, i]));
  const tot = c => { const x = mun.m[c]; if (!x) return 0; return Object.values(x.a).reduce((s, v) => s + v[ix.total], 0); };
  const linhas = feats.map(f => { const c = f.properties.id, t = tot(c), p = (mun.m[c] || {}).p || 0; return { c, n: f.properties.name, t, p, h: p ? t / p : null }; });
  const CORES = ['#f3eded', '#e7d3d1', '#d9b5b1', '#c8928c', '#b46f68', '#9b4a44', '#7d1d1d'];
  const vals = linhas.map(l => l.h).filter(v => v != null).sort((a, b) => a - b);
  const q = CORES.slice(1).map((_, i) => vals[Math.floor(vals.length * (i + 1) / CORES.length)]);
  const cls = v => { if (v == null) return -1; let i = 0; while (i < q.length && v > q[i]) i++; return i; };
  const W = 700, H = 520, proj = d3.geoMercator().fitExtent([[4, 4], [W - 4, H - 4]], { type: 'FeatureCollection', features: feats }), path = d3.geoPath(proj);
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Emendas recebidas por habitante nos municípios">${feats.map(f => { const l = linhas.find(x => x.c === f.properties.id); const k = cls(l.h); return `<path d="${path(f)}" fill="${k < 0 ? '#e5e7eb' : CORES[k]}" stroke="#fff" stroke-width=".5"/>`; }).join('')}</svg>`;
  const topV = [...linhas].sort((a, b) => b.t - a.t).slice(0, 12);
  const topH = linhas.filter(l => l.h != null).sort((a, b) => b.h - a.h).slice(0, 12);
  $('#mapaUf').innerHTML = `<h3>Emendas recebidas por habitante nos municípios</h3><div class="mapa">${svg}</div>
    <div class="escala">${CORES.map(c => `<span style="--c:${c}"></span>`).join('')}</div><p class="peq">Do menor ao maior valor por habitante, em sete faixas com o mesmo número de municípios. Pagamentos a prefeituras, fundos municipais e entidades locais.</p>
    <div class="duas"><div><h3>Maiores valores recebidos</h3><table><tbody>${topV.map(l => `<tr><td>${esc(l.n)}</td><td class="d num">${reais(l.t)}</td></tr>`).join('')}</tbody></table></div>
      <div><h3>Maiores valores por habitante</h3><table><tbody>${topH.map(l => `<tr><td>${esc(l.n)} <span class="peq">${fmt(l.p)} hab.</span></td><td class="d num">R$ ${fmt(Math.round(l.h))}</td></tr>`).join('')}</tbody></table></div></div>`;
}

// --------------------------------------------------------------- escolha
async function escolher() {
  const ind = await json('dados/indice.json');
  const ps = Object.entries(ind.p).filter(([, p]) => p.vd || p.np).sort((a, b) => a[1].n.localeCompare(b[1].n));
  $('#folha').innerHTML = `<header class="cab"><div class="tipo">Dossiês</div><h1>Gerar um dossiê</h1>
    <p class="sub">Documentos prontos para imprimir ou salvar em PDF, com proposições, votações e emendas parlamentares.</p></header>
    <div class="escolha">
      <form class="cartao" id="fParl"><h2>Dossiê parlamentar</h2><p class="leve">Classificação, índice de alinhamento, proposições com pauta da direita, votações disputadas e emendas de um deputado ou senador.</p>
        <label for="nomeParl" class="peq">Nome do parlamentar</label><input id="nomeParl" list="listaParl" autocomplete="off" placeholder="Digite o nome">
        <datalist id="listaParl">${ps.map(([k, p]) => `<option value="${esc(p.n)} (${esc(partido(p))}-${esc(p.uf || '')})">`).join('')}</datalist>
        <button type="submit">Gerar dossiê</button><p class="peq" id="avisoParl"></p></form>
      <form class="cartao" id="fUf"><h2>Dossiê estadual</h2><p class="leve">Bancada e alinhamento, proposições da bancada e emendas destinadas ao estado e aos municípios.</p>
        <label for="selUf" class="peq">Estado</label><select id="selUf">${Object.entries(UFNOME).sort((a, b) => a[1].localeCompare(b[1])).map(([u, n]) => `<option value="${u}">${n}</option>`).join('')}</select>
        <button type="submit">Gerar dossiê</button></form>
    </div>`;
  const porRotulo = new Map(ps.map(([k, p]) => [`${p.n} (${partido(p)}-${p.uf || ''})`, k]));
  $('#fParl').addEventListener('submit', e => { e.preventDefault(); const v = $('#nomeParl').value.trim(); const k = porRotulo.get(v) || (ps.find(([, p]) => p.n.toLowerCase() === v.toLowerCase()) || [])[0]; if (!k) { $('#avisoParl').textContent = 'Escolha um nome da lista.'; return; } location.search = '?tipo=parlamentar&id=' + encodeURIComponent(k); });
  $('#fUf').addEventListener('submit', e => { e.preventDefault(); location.search = '?tipo=estado&uf=' + $('#selUf').value; });
}

$('#imprimir').addEventListener('click', () => window.print());
const q = new URLSearchParams(location.search);
(q.get('tipo') === 'parlamentar' ? dossieParlamentar(q.get('id')) : q.get('tipo') === 'estado' ? dossieEstado((q.get('uf') || '').toUpperCase()) : escolher())
  .catch(e => { $('#folha').innerHTML = `<p class="carregando">Não foi possível gerar o dossiê (${esc(e.message)}). <a href="dossie.html">Escolher outro</a>.</p>`; });
</script>
</body>
