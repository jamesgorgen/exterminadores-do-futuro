# Comparador de textos: processa os pedidos deixados no R2 pelo Worker público (cloudflare/comparador).
# Roda a cada 5 minutos (o GitHub pode atrasar), quando o robô do comparador muda e à mão em Actions > Comparador > Run workflow.
# Sem pedidos na fila, termina em segundos.
name: Comparador

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths: ['robo/comparador/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comparador
  cancel-in-progress: false

jobs:
  fila:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: robo/comparador
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: |
          pip install -q boto3
          command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null)
      - name: Processar a fila
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: exterminadores-dados
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python robo/comparador/fila.py
