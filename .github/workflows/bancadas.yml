# Enquadramento dos parlamentares nas bancadas temáticas (robo/bancadas.py, sem IA).
# Roda todo dia (para levar ao site as decisões da triagem), quando mudam as regras (bancadas-regras.json) ou o robô, e à mão em
# Actions > Bancadas > Run workflow. O resultado tem vínculos de familiares e terceiros e vai só para o R2 privado
# (bancadas/bancadas.json), lido pela triagem no Worker da Cloudflare. No repositório vai só a versão pública
# (dados/bancadas.json): bancadas publicadas, núcleo e aliados conferidos e evidências do próprio parlamentar.
name: Bancadas

on:
  schedule:
    - cron: '37 9 * * *'
  push:
    branches: [main]
    paths: ['bancadas-regras.json', 'robo/bancadas.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bancadas
  cancel-in-progress: false

jobs:
  bancadas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: pip install -q requests boto3
      - name: Calcular os sinais
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: exterminadores-dados
        run: python robo/bancadas.py
      - name: Gravar a versão pública
        run: |
          git config user.name "robo-exterminadores"
          git config user.email "robo-exterminadores@users.noreply.github.com"
          [ -f dados/bancadas.json ] || exit 0
          git add dados/bancadas.json
          if git diff --cached --quiet; then echo "Nada mudou."; else
            git commit -m "Atualiza as bancadas publicadas ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          fi
