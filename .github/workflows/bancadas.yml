# Enquadramento dos parlamentares nas bancadas temáticas (robo/bancadas.py, sem IA).
# Roda no dia 3 de cada mês, quando mudam as regras (bancadas-regras.json), o robô ou as votações-chave
# marcadas pela equipe (bancadas-correcoes.json), e à mão em Actions > Bancadas > Run workflow.
name: Bancadas

on:
  schedule:
    - cron: '37 9 3 * *'
  push:
    branches: [main]
    paths: ['bancadas-regras.json', 'robo/bancadas.py', 'bancadas-correcoes.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bancadas
  cancel-in-progress: false

jobs:
  bancadas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: pip install -q requests boto3
      - name: Calcular os sinais
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: exterminadores-dados
        run: python robo/bancadas.py
      - name: Gravar no repositório
        run: |
          git config user.name "robo-exterminadores"
          git config user.email "robo-exterminadores@users.noreply.github.com"
          git add dados/bancadas.json
          if git diff --cached --quiet; then echo "Nada mudou."; else
            git commit -m "Atualiza as bancadas ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          fi
