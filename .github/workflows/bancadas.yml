# Enquadramento dos parlamentares nas bancadas temáticas (robo/bancadas.py, sem IA).
# Roda no dia 3 e no dia 17 de cada mês, quando mudam as regras (bancadas-regras.json) ou o robô, e à mão em
# Actions > Bancadas > Run workflow. O resultado tem vínculos de familiares e terceiros e vai só para o R2 privado
# (bancadas/bancadas.json), lido pela triagem no Worker da Cloudflare. Nada é gravado no repositório.
name: Bancadas

on:
  schedule:
    - cron: '37 9 3,17 * *'
  push:
    branches: [main]
    paths: ['bancadas-regras.json', 'robo/bancadas.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bancadas
  cancel-in-progress: false

jobs:
  bancadas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: pip install -q requests boto3
      - name: Calcular os sinais
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: exterminadores-dados
        run: python robo/bancadas.py
