# Análises avulsas (não alteram o site). Roda um script de robo/analises e guarda os resultados como artefato da execução.
# À mão: Actions > Análises avulsas > Run workflow, informando o nome do script.
name: Análises avulsas

on:
  # Também roda quando robo/analises/fila.txt muda no main: a primeira linha é o nome do script.
  push:
    branches: [main]
    paths: ['robo/analises/fila.txt']
  workflow_dispatch:
    inputs:
      script:
        description: 'Script em robo/analises (ex.: sonda.sh)'
        required: true

permissions:
  contents: write

jobs:
  analise:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: pip install -q pandas pyarrow requests unidecode
      - name: Qual script
        env:
          ENTRADA: ${{ inputs.script }}
        run: echo "SCRIPT=${ENTRADA:-$(head -1 robo/analises/fila.txt | tr -d '[:space:]')}" >> "$GITHUB_ENV"
      - name: Rodar
        env:
          TOKEN_GH: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p saida
          case "$SCRIPT" in
            *.sh) bash "robo/analises/$SCRIPT" ;;
            *.py) python "robo/analises/$SCRIPT" ;;
            *) echo "Tipo de script não suportado"; exit 1 ;;
          esac
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saida
          path: saida/
          retention-days: 14
      - name: Publicar resultados no ramo analises-saida
        if: always()
        run: |
          cd saida && git init -q -b "analises-saida-${SCRIPT%.*}" && git add -A
          git -c user.name=robo-exterminadores -c user.email=robo-exterminadores@users.noreply.github.com commit -qm "Saída de $SCRIPT" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "analises-saida-${SCRIPT%.*}"
