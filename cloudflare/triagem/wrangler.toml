# Worker da triagem das bancadas: serve a página e guarda dados e decisões no R2 privado (cloudflare/triagem).
# Protegido pelo Cloudflare Access. Publicado pelo workflow "Publicar a triagem" (.github/workflows/triagem.yml).
name = "triagem-exterminadores"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

rules = [ { type = "Text", globs = ["**/*.html"], fallthrough = false } ]

[[r2_buckets]]
binding = "R2"
bucket_name = "exterminadores-dados"

# Preencher depois de ligar o Cloudflare Access no Worker (não são segredos):
# ACCESS_TEAM é o nome da equipe do Zero Trust (o "xxx" de xxx.cloudflareaccess.com); vazio, vale a equipe do token, que /api/eu mostra;
# ACCESS_AUD é a "Application Audience (AUD) Tag" do aplicativo do Access.
[vars]
ACCESS_TEAM = "damp-disk-c734"
ACCESS_AUD = "ca13754a01e0f1aa306036e895c40a02e18c7939d445f66789511691cc406746"
