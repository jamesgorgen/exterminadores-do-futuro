# Worker público do comparador de textos (cloudflare/comparador). Sem Cloudflare Access: a página comparador.html do site usa esta API.
# Publicado pelo workflow "Publicar o comparador" (.github/workflows/comparador-worker.yml).
name = "comparador-exterminadores"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Envio de e-mail (link de acesso), pelo Cloudflare Email Service. Exige o domínio habilitado para envio no painel.
[[send_email]]
name = "EMAIL"

# Acompanhamento de projetos: confere os projetos seguidos a cada hora e manda o resumo por e-mail às 19h de Brasília.
[triggers]
crons = ["17 * * * *"]

[[r2_buckets]]
binding = "R2"
bucket_name = "exterminadores-dados"

[vars]
# Teto geral de comparações novas por mês (além do limite de uma por semana por conta), para conter o custo da IA.
LIMITE_GLOBAL_MES = "300"
# teto mensal da conta do responsável, à parte do teto dos demais usuários
LIMITE_DONO_MES = "300"
